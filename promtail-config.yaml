server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 102400

scrape_configs:
  - job_name: docker-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s

    relabel_configs:
      # Filter for aihealth-server project (FIXED!)
      - source_labels:
          [__meta_docker_container_label_com_docker_compose_project]
        regex: aihealth-server
        action: keep

      # Container name
      - source_labels: [__meta_docker_container_name]
        target_label: container
        regex: "/(.*)"
        replacement: "${1}"

      # Use Compose service as job label
      - source_labels:
          [__meta_docker_container_label_com_docker_compose_service]
        target_label: job
        replacement: "${1}"

      # Fallback for job label
      - target_label: job
        replacement: "unknown"

      # Required instance label
      - target_label: instance
        replacement: "aihealth-server"

      # Set log path
      - source_labels: [__meta_docker_container_log_path]
      
        target_label: __path__

      # Drop all the temporary Docker meta labels
      - action: labeldrop
        regex: "__meta_docker.*"
      - action: labeldrop
        regex: "__.*"
