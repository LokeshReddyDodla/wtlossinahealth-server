server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 102400

scrape_configs:
  - job_name: api_files
    static_configs:
      - targets: [localhost]
        labels:
          job: 'api_logs'
          component: 'backend'
          default_label: 'api' # Added default label
          __path__: /var/log/api/*.log # Ensure this is correct
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\S+) (?P<level>\w+) (?P<message>.*)'
      - labels:
          level: