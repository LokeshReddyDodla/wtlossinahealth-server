name: Test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

concurrency:
  # Cancel older runs on the same branch when a new commit lands.
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          pipx install poetry==2.2.1

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: poetry-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py3.12-

      - name: Configure Poetry to create .venv in project
        run: poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run pytest
        # Tests mock the database — no real Postgres needed. But several
        # service modules (postgres_store.py, etc.) read env vars at import
        # time, so we need to satisfy them with valid-looking dummy URLs.
        env:
          POSTGRES_ASYNCPG_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
        run: poetry run pytest tests/ -v --tb=short
