name: Deploy

on:
  push:
    branches:
      - "main"

jobs:
  deploy:
    runs-on: ubuntu-latest
  
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install SSH Key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.SSH_KEY }}
        known_hosts: ${{ secrets.SSH_HOST }}
    
    - name: Set permissions for SSH Key
      run: |
        chmod 600 /home/runner/.ssh/id_rsa

    - name: Debug SSH Key
      run: |
        ssh -i /home/runner/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "echo SSH connection successful"

    - name: Deploy to Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /home/deployer/aihealth-deployment/aihealth-server
          git pull origin main
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S docker-compose down
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S docker-compose up --build -d