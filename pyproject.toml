# ─────────────────────────────────────────────────────────────────────────────
# Ruff — single source of truth for formatting + linting + import sorting.
# Replaces the black + isort + flake8 + pylint stack that previously lived here.
# ─────────────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 79
target-version = "py310"
exclude = [
  ".git",
  ".venv",
  "__pycache__",
  "build",
  "dist",
]

[tool.ruff.lint]
# E/W   : pycodestyle errors + warnings
# F     : pyflakes (unused imports, undefined names, etc.)
# I     : isort
# B     : flake8-bugbear (subset of common bug patterns)
# UP    : pyupgrade (modern syntax suggestions)
# SIM   : flake8-simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = [
  "E501",   # line-too-long — trailing-whitespace lint, not enforced
  "E203",   # whitespace-before-punctuation — black/ruff slice convention
  "E722",   # bare-except — flagged separately when needed
  "B008",   # function-call-in-default-arg — FastAPI Depends() pattern
  "B904",   # raise-without-from-inside-except — too noisy on existing code
  "SIM102", # nested-if-statements — sometimes intentional for readability
  "SIM108", # ternary-instead-of-if-else — readability preference
  "UP007",  # use-X-or-Y-instead-of-union — keep both syntaxes for now
]

[tool.ruff.lint.isort]
known-first-party = ["lib", "rest_server", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests can use bare assertions and have lots of long fixtures
"tests/**/*.py" = ["E501", "B011"]
# Alembic migrations are auto-generated
"alembic/versions/*.py" = ["E", "W", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
