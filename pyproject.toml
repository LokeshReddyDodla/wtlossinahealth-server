[tool.poetry]
name = "aihealth-server"
version = "0.1.0"
description = "AiHealth backend server"
authors = ["Mukhtar <mukhtar@ahealth.in>"]
# package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
fastapi = "^0.109.0"
# langchain = "^0.2.0"
# pydantic = { version = "^1.10.7", allow-prereleases = true }
pydantic = "^2.9.2"
uvicorn = "^0.30.1"
gunicorn = "^22.0.0"
pottery = "^3.0.0"
structlog = "^24.2.0"
python-jose = "^3.3.0"
websockets = "^15.0"
asyncpg = "^0.30.0"
PyPika = "^0.48.9"
ujson = "^5.10.0"
openai = "^1.35.10"
python-decouple = "^3.8"
boto3 = "^1.34.98"
pytz = "^2024.1"
pillow = "^10.3.0"
requests = "^2.31.0"
tiktoken = "^0.7.0"
motor = "^3.5.0"
sqlalchemy = {version = "^2.0.31", extras = ["postgresql_asyncpg"]}
alembic = "^1.13.2"
watchdog = "^4.0.1"
psycopg2-binary = "^2.9.10"
uuid = "^1.30"
python-multipart = "^0.0.9"
pandas = "^2.2.2"
clickhouse-driver = "^0.2.8"
passlib = "^1.7.4"
loguru = "^0.7.2"
python-dateutil = "^2.9.0.post0"
celery = { extras = ["asyncio"], version = "^5.4.0" }
aioredis = "^2.0.1"
singleton-decorator = "^1.0.0"
python-socketio = { extras = ["client"], version = "^5.11.4" }
faker = "^29.0.0"
google-auth = "^2.35.0"
google-auth-oauthlib = "^1.2.1"
firebase-admin = "^6.5.0"
asgiref = "^3.8.1"
nest-asyncio = "^1.6.0"
orjson = "^3.10.7"
markdownify = "^0.13.1"
punq = "^0.7.0"
twilio = "^9.7.0"
celery-aio-pool = "^0.1.0rc8"
qdrant-client = "^1.15.1"
pdfplumber = "^0.11.7"
python-docx = "^1.2.0"
pytesseract = "^0.3.13"
pdf2image = "^1.17.0"
instructor = "^1.11.3"
eval-type-backport = "^0.2.2"
openpyxl = "^3.1.5"
xlrd = "^2.0.2"
langchain = "^1.2.4"
langchain-community = "^0.4.1"
langchain-openai = "^1.1.7"
tenacity = "^9.1.2"
langgraph = "^1.0.6"
langchain-google-genai = "^4.2.0"
jsonpickle = "^4.1.1"
arq = "^0.27.0"
rich = "^14.3.2"
2captcha-python = "^2.0.2"


[tool.poetry.group.dev.dependencies]
isort = "^5.10.1"
pylint = "^2.15.2"
pre-commit = "^2.20.0"
black = "^22.8.0"
doppler-env = "^0.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 79
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.env
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
include_trailing_comma = true
use_parentheses = true
multi_line_output = 2
force_grid_wrap = 0
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
default_section = "THIRDPARTY"
known_first_party = ["rest_server"]
line_length = 79
known_third_party = ["fastapi", "pydantic", "starlette"]
force_to_top = true

[tool.flake8]
format = "flake8"
show-source = true
statistics = true
doctests = true
enable-extensions = "G"
strictness = "long"
docstring-style = "numpy"
max-line-length = 79
max-complexity = 25
exclude = [".git", "__pycache__", ".venv", ".eggs", "*.egg"]
ignore = [
  "D100",
  "D104",
  "D106",
  "D401",
  "X100",
  "W504",
  "RST303",
  "RST304",
  "DAR103",
  "DAR203",
  "E501",
  "W503",
  "E203",
  "E722",
  "B001",
  "B008",
  "SIM106",
  "C901",
  "SIM102",
]
per-file-ignores = """
  server/settings/*.py: WPS226, WPS407, WPS412, WPS432
  server/*/migrations/*.py: WPS102, WPS114, WPS432
  tests/*.py: S101, WPS432
  app/*.py: B008
"""

[tool.pylint.MESSAGE_CONTROL]
