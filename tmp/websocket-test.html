<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO Client Test</title>
    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
</head>
<body>
    <h1>Socket.IO Client Test</h1>
    <script>
        const chatId = '1c7a6ff8-953c-444e-b4be-1880ff8f7f1e'; 
        const namespacePath = `/ws/chat/${chatId}`;

        const groupId = '5678';  // Replace with your desired group_id

        // Connect to the Socket.IO server for chat namespace
        const socketChat = io('ws://localhost:8000', { 
            path: namespacePath,
            transports: ["websocket"], 
        });

        socketChat.on('connect', () => {
            console.log('Connected to the chat namespace');
            // Emit a message to the chat room
            socketChat.emit('message', { room: chatId, message: 'Hello from chat client!' });
        });

        socketChat.on('message', (data) => {
            console.log('Received message from chat:', data);
        });

        socketChat.on('disconnect', () => {
            console.log('Disconnected from the chat namespace');
        });
