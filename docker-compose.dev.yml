services:
  # ==========================================
  # Core Application
  # ==========================================
  aihealth-api:
    container_name: aihealth-api
    build:
      context: "."
      dockerfile: ./deployment/rest_server/Dockerfile
    image: aihealth-api:latest
    restart: no
    ports:
      - 8000:8000
    environment:
      # JWT
      - JWT_ALGORITHM
      - JWT_SECRET
      - JWT_AUDIENCE
      # Redis
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # PostgreSQL
      - POSTGRES_URL=${POSTGRES_URL}
      - POSTGRES_ASYNCPG_URL=${POSTGRES_ASYNCPG_URL}
      - POSTGRES_URL_SYNC=${POSTGRES_URL_SYNC}
      - POSTGRES_SCHEMA=${POSTGRES_SCHEMA}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # MongoDB
      - MONGO_URL=${MONGO_URL}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      # Celery
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - api_logs:/src/logs
      - alembic_data:/src/alembic/versions
      - .:/src
    depends_on:
      - aihealth-redis
      - aihealth-postgres
      - aihealth-mongo
      - aihealth-clickhouse
      - aihealth-qdrant

  # ==========================================
  # Databases
  # ==========================================
  aihealth-postgres:
    container_name: aihealth-postgres
    image: postgres:16.4-alpine
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  aihealth-mongo:
    container_name: aihealth-mongo
    image: mongo:latest
    restart: unless-stopped
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DB_NAME}
      - MONGO_REPLICA_SET_NAME=rs0
    volumes:
      - mongo_data:/data/db
      - ./mongodb-keyfile:/etc/mongo-keyfile/mongodb-keyfile
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --port
      - "27017"
      - --auth
      - --keyFile
      - /etc/mongo-keyfile/mongodb-keyfile

  aihealth-redis:
    container_name: aihealth-redis
    image: redis:alpine
    restart: unless-stopped
    ports:
      - 6379:6379
    command:
      - "--requirepass ${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data

  aihealth-clickhouse:
    container_name: aihealth-clickhouse
    image: clickhouse/clickhouse-server:25.8
    restart: no
    ports:
      - 8123:8123
      - 9000:9000
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_MAX_THREADS=4
      - CLICKHOUSE_BACKGROUND_POOL_SIZE=2
      - CLICKHOUSE_BACKGROUND_MERGE_POOL_SIZE=2
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  aihealth-qdrant:
    container_name: aihealth-qdrant
    image: qdrant/qdrant:v1.11.0
    restart: unless-stopped
    ports:
      - 6333:6333
      - 6334:6334
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
    volumes:
      - qdrant_data:/qdrant/storage

  aihealth-arq-redis:
    container_name: aihealth-arq-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - 6380:6379
    command:
      - redis-server
      - --appendonly
      - yes
      - --requirepass
      - ${ARQ_REDIS_PASSWORD}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - arq_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${ARQ_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Task Workers - Celery (Legacy)
  # ==========================================
  aihealth-celery-default:
    container_name: aihealth-celery-default
    image: aihealth-api:latest
    restart: unless-stopped
    command: >
      /opt/pysetup/.venv/bin/python -m celery -A lib.core.celery_app.celery worker
      --pool=custom --loglevel=info --concurrency=4 -Q default
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - CELERY_CUSTOM_WORKER_POOL=celery_aio_pool.pool:AsyncIOPool
      - POSTGRES_ASYNCPG_URL=${POSTGRES_ASYNCPG_URL}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_HOST=${QDRANT_HOST}
      - QDRANT_PORT=${QDRANT_PORT}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION}
    volumes:
      - celery_logs:/var/log/celery
      - celery_data:/var/lib/celery
    depends_on:
      - aihealth-redis
      - aihealth-api
      

  aihealth-celery-beat:
    container_name: aihealth-celery-beat
    image: aihealth-api:latest
    restart: unless-stopped
    command: >
      /opt/pysetup/.venv/bin/python -m celery -A lib.core.celery_app.celery beat
      --loglevel=info
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - POSTGRES_ASYNCPG_URL=${POSTGRES_ASYNCPG_URL}
    volumes:
      - celery_beat_logs:/var/log/celery
    depends_on:
      - aihealth-redis
      - aihealth-api

  # ==========================================
  # Task Workers - ARQ
  # ==========================================
  aihealth-arq-worker:
    container_name: aihealth-arq-worker
    image: aihealth-api:latest
    restart: unless-stopped
    command: >
      /opt/pysetup/.venv/bin/python -m arq lib.workers.arq.worker.WorkerSettings
    environment:
      # Timezone
      - TZ=Asia/Kolkata
      # ARQ Redis
      - ARQ_REDIS_HOST=${ARQ_REDIS_HOST}
      - ARQ_REDIS_PASSWORD=${ARQ_REDIS_PASSWORD}
      - ARQ_REDIS_PORT=${ARQ_REDIS_PORT}
      - ARQ_REDIS_DB=${ARQ_REDIS_DB}
      # Redis
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # PostgreSQL
      - POSTGRES_ASYNCPG_URL=${POSTGRES_ASYNCPG_URL}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # MongoDB
      - MONGO_URL=${MONGO_URL}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      # Qdrant
      - QDRANT_HOST=${QDRANT_HOST}
      - QDRANT_PORT=${QDRANT_PORT}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION}
      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - arq_logs:/var/log/arq
      - .:/src
    depends_on:
      aihealth-arq-redis:
        condition: service_healthy
      aihealth-api:
        condition: service_started
      aihealth-postgres:
        condition: service_started
      aihealth-mongo:
        condition: service_started

  aihealth-arq-worker-reports:
    container_name: aihealth-arq-worker-reports
    image: aihealth-api:latest
    restart: unless-stopped
    command: >
      /opt/pysetup/.venv/bin/python -m arq lib.workers.arq.worker.ReportsWorkerSettings
    environment:
      # ARQ Redis
      - ARQ_REDIS_HOST=${ARQ_REDIS_HOST}
      - ARQ_REDIS_PASSWORD=${ARQ_REDIS_PASSWORD}
      - ARQ_REDIS_PORT=${ARQ_REDIS_PORT}
      - ARQ_REDIS_DB=${ARQ_REDIS_DB}
      # Redis
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # PostgreSQL
      - POSTGRES_ASYNCPG_URL=${POSTGRES_ASYNCPG_URL}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # MongoDB
      - MONGO_URL=${MONGO_URL}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      # Qdrant
      - QDRANT_HOST=${QDRANT_HOST}
      - QDRANT_PORT=${QDRANT_PORT}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION}
      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - arq_logs:/var/log/arq
      - .:/src
    depends_on:
      aihealth-arq-redis:
        condition: service_healthy
      aihealth-api:
        condition: service_started
      aihealth-postgres:
        condition: service_started
      aihealth-mongo:
        condition: service_started

  aihealth-arq-worker-vectors:
    container_name: aihealth-arq-worker-vectors
    image: aihealth-api:latest
    restart: unless-stopped
    command: >
      /opt/pysetup/.venv/bin/python -m arq lib.workers.arq.worker.VectorsWorkerSettings
    environment:
      # ARQ Redis
      - ARQ_REDIS_HOST=${ARQ_REDIS_HOST}
      - ARQ_REDIS_PASSWORD=${ARQ_REDIS_PASSWORD}
      - ARQ_REDIS_PORT=${ARQ_REDIS_PORT}
      - ARQ_REDIS_DB=${ARQ_REDIS_DB}
      # Redis
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # PostgreSQL
      - POSTGRES_ASYNCPG_URL=${POSTGRES_ASYNCPG_URL}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # MongoDB
      - MONGO_URL=${MONGO_URL}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      # Qdrant
      - QDRANT_HOST=${QDRANT_HOST}
      - QDRANT_PORT=${QDRANT_PORT}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION}
      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - arq_logs:/var/log/arq
      - .:/src
    depends_on:
      aihealth-arq-redis:
        condition: service_healthy
      aihealth-api:
        condition: service_started
      aihealth-postgres:
        condition: service_started
      aihealth-mongo:
        condition: service_started
      aihealth-qdrant:
        condition: service_started

  aihealth-arq-worker-libreview:
    container_name: aihealth-arq-worker-libreview
    image: aihealth-api:latest
    restart: unless-stopped
    command: >
      /opt/pysetup/.venv/bin/python -m arq lib.workers.arq.worker.LibreViewWorkerSettings
    environment:
      # ARQ Redis
      - ARQ_REDIS_HOST=${ARQ_REDIS_HOST}
      - ARQ_REDIS_PASSWORD=${ARQ_REDIS_PASSWORD}
      - ARQ_REDIS_PORT=${ARQ_REDIS_PORT}
      - ARQ_REDIS_DB=${ARQ_REDIS_DB}
      # Redis
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # PostgreSQL
      - POSTGRES_ASYNCPG_URL=${POSTGRES_ASYNCPG_URL}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # MongoDB
      - MONGO_URL=${MONGO_URL}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      # ClickHouse
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      # LibreView
      - LIBREVIEW_AUTH_TOKEN=${LIBREVIEW_AUTH_TOKEN}
      - LIBREVIEW_ACCOUNT_ID=${LIBREVIEW_ACCOUNT_ID}
      - LIBREVIEW_SITE_KEY=${LIBREVIEW_SITE_KEY}
      - LIBREVIEW_API_BASE_URL=${LIBREVIEW_API_BASE_URL}
      # 2Captcha
      - TWOCAPTCHA_API_KEY=${TWOCAPTCHA_API_KEY}
    volumes:
      - arq_logs:/var/log/arq
      - .:/src
    depends_on:
      aihealth-arq-redis:
        condition: service_healthy
      aihealth-api:
        condition: service_started
      aihealth-postgres:
        condition: service_started
      aihealth-clickhouse:
        condition: service_started

  # ==========================================
  # Development Tools
  # ==========================================
  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    restart: unless-stopped
    ports:
      - 8081:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
      - PGADMIN_CONFIG_WTF_CSRF_CHECK_DEFAULT=False
      - PGADMIN_CONFIG_WTF_CSRF_ENABLED=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redisinsight:
    container_name: redisinsight
    image: redislabs/redisinsight:latest
    restart: unless-stopped
    ports:
      - 5540:5540
    volumes:
      - redisinsight_data:/data

  flower:
    container_name: flower
    image: mher/flower
    restart: unless-stopped
    ports:
      - 5555:5555
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
    depends_on:
      - aihealth-redis

  mongo-express:
    container_name: mongo-express
    image: mongo-express:latest
    restart: unless-stopped
    ports:
      - 8082:8081
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - ME_CONFIG_MONGODB_SERVER=aihealth-mongo
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGOEXPRESS_LOGIN}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGOEXPRESS_PASSWORD}
    volumes:
      - ./config.js:/node_modules/mongo-express/config.default.js
    depends_on:
      - aihealth-mongo

  cloudbeaver:
    container_name: cloudbeaver
    image: dbeaver/cloudbeaver:latest
    restart: unless-stopped
    ports:
      - 8084:8978
    environment:
      - CB_ADMIN_NAME=${CB_ADMIN_NAME}
      - CB_ADMIN_PASSWORD=${CB_ADMIN_PASSWORD}
      - CB_AUTO_CREATE=true
    volumes:
      - cloudbeaver_workspace:/opt/cloudbeaver/workspace

  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    ports:
      - 9001:9000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  # ==========================================
  # Infrastructure
  # ==========================================
  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    volumes:
      - ./cloudflared:/etc/cloudflared

  loki:
    container_name: loki
    image: grafana/loki:latest
    restart: unless-stopped
    ports:
      - 3100:3100
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
      - ./deployment/loki-config.yaml:/etc/loki/local-config.yaml:ro

  promtail:
    container_name: promtail
    image: grafana/promtail:latest
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./deployment/promtail-config.yml:/etc/promtail/config.yml:ro
    depends_on:
      - loki

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployment/grafana-provisioning:/etc/grafana/provisioning
    depends_on:
      - loki

volumes:
  # Application
  api_logs:
  alembic_data:
  # Databases
  postgres_data:
  mongo_data:
  redis_data:
  clickhouse_data:
  qdrant_data:
  arq_redis_data:
  # Workers
  celery_logs:
  celery_data:
  celery_beat_logs:
  arq_logs:
  # Development Tools
  pgadmin_data:
  redisinsight_data:
  cloudbeaver_workspace:
  portainer_data:
  # Infrastructure
  ssl_certs:
  loki_data:
  grafana_data:

networks:
  shared_network:
    external: true
