<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Support Tickets — Test Dashboard</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161922;
    --panel-2: #1c2030;
    --border: #2a3041;
    --text: #e6e8ee;
    --muted: #8a93a6;
    --accent: #5b9dff;
    --accent-soft: #1e2a44;
    --ok: #4ad27f;
    --warn: #ffb648;
    --bad: #ff6b6b;
    --pill-open: #2a4a8a;
    --pill-pending: #6b5024;
    --pill-resolved: #2a5a3a;
    --pill-closed: #404552;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    grid-template-rows: auto 1fr;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  header h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 600; }
  header input, header select {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px;
    border-radius: 4px;
    font: inherit;
    min-width: 180px;
  }
  header input[type="text"][data-field="apiBase"] { min-width: 220px; }
  header input[type="text"][data-field="jwt"] { flex: 1; min-width: 320px; }
  header button {
    background: var(--accent);
    color: white;
    border: 0;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font: inherit;
  }
  header button.secondary { background: var(--panel-2); border: 1px solid var(--border); }
  header .status { font-size: 12px; color: var(--muted); margin-left: auto; }
  main {
    display: grid;
    grid-template-columns: 380px 1fr;
    overflow: hidden;
  }
  #queue {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    background: var(--panel);
  }
  #queue .toolbar {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 6px;
    align-items: center;
    position: sticky;
    top: 0;
    background: var(--panel);
  }
  #queue .toolbar select {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 6px;
    border-radius: 4px;
    font: inherit;
  }
  #queue .row {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  #queue .row:hover { background: var(--panel-2); }
  #queue .row.active { background: var(--accent-soft); }
  #queue .row .top {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  #queue .row .subject {
    margin-top: 4px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #queue .row .preview {
    margin-top: 2px;
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pill {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 100px;
    font-weight: 600;
    letter-spacing: .02em;
  }
  .pill.open { background: var(--pill-open); }
  .pill.pending { background: var(--pill-pending); }
  .pill.resolved { background: var(--pill-resolved); }
  .pill.closed { background: var(--pill-closed); color: var(--muted); }
  .pill.product { background: #322a4a; }
  .pill.facility { background: #2a4a4a; }

  #detail {
    display: grid;
    grid-template-rows: auto 1fr auto;
    overflow: hidden;
  }
  #detail .meta {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  #detail .meta .title { font-size: 16px; font-weight: 600; flex: 1; min-width: 200px; }
  #detail .meta select {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 8px;
    border-radius: 4px;
    font: inherit;
  }
  #thread {
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 70%;
    padding: 8px 12px;
    border-radius: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
  }
  .msg.me {
    align-self: flex-end;
    background: var(--accent-soft);
    border-color: #2a4276;
  }
  .msg .from { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .msg .ts { font-size: 11px; color: var(--muted); margin-top: 4px; text-align: right; }
  .msg .content { white-space: pre-wrap; word-break: break-word; }
  .msg .media { margin-top: 6px; font-size: 12px; }
  .msg .media a { color: var(--accent); }

  #composer {
    border-top: 1px solid var(--border);
    padding: 10px 12px;
    background: var(--panel);
    display: flex;
    gap: 8px;
  }
  #composer textarea {
    flex: 1;
    resize: vertical;
    min-height: 40px;
    max-height: 200px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 10px;
    font: inherit;
  }
  #composer button {
    background: var(--accent);
    color: white;
    border: 0;
    border-radius: 6px;
    padding: 0 16px;
    cursor: pointer;
    font: inherit;
    font-weight: 600;
  }

  .empty {
    color: var(--muted);
    padding: 40px;
    text-align: center;
  }
  .toast {
    position: fixed;
    bottom: 16px;
    right: 16px;
    padding: 10px 14px;
    border-radius: 6px;
    background: var(--bad);
    color: white;
    font-size: 13px;
    max-width: 360px;
    z-index: 10;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .toast.ok { background: var(--ok); color: #0a1a10; }
</style>
</head>
<body>
<header>
  <h1>Support Tickets — Agent</h1>
  <label>API
    <input type="text" data-field="apiBase" placeholder="https://api.example.com" />
  </label>
  <label>JWT
    <input type="text" data-field="jwt" placeholder="Bearer token from /v1/auth/login" />
  </label>
  <button id="connect">Connect</button>
  <button id="refresh" class="secondary">Refresh</button>
  <span class="status" id="status">disconnected</span>
</header>

<main>
  <section id="queue">
    <div class="toolbar">
      <select id="filterScope">
        <option value="">All scopes</option>
        <option value="product">Product</option>
        <option value="facility">Facility</option>
      </select>
      <select id="filterStatus">
        <option value="">All statuses</option>
        <option value="open">Open</option>
        <option value="pending">Pending</option>
        <option value="resolved">Resolved</option>
        <option value="closed">Closed</option>
      </select>
      <select id="filterRequester">
        <option value="">All requesters</option>
        <option value="patient">Patient</option>
        <option value="care_provider">Care Provider</option>
      </select>
    </div>
    <div id="rows"></div>
  </section>

  <section id="detail">
    <div class="meta" id="meta">
      <div class="empty">Select a ticket from the queue.</div>
    </div>
    <div id="thread"></div>
    <div id="composer" style="display:none;">
      <textarea id="reply" placeholder="Type your reply… (⌘/Ctrl+Enter to send)"></textarea>
      <button id="send">Send</button>
    </div>
  </section>
</main>

<script>
"use strict";

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));

const state = {
  apiBase: localStorage.getItem("supportApiBase") || "",
  jwt: localStorage.getItem("supportJwt") || "",
  myUserId: null,        // decoded from JWT
  tickets: [],
  activeTicketId: null,
  pollHandle: null,
};

$('[data-field="apiBase"]').value = state.apiBase;
$('[data-field="jwt"]').value = state.jwt;

function setStatus(msg, ok = true) {
  const el = $("#status");
  el.textContent = msg;
  el.style.color = ok ? "var(--muted)" : "var(--bad)";
}

function toast(msg, ok = false) {
  const t = document.createElement("div");
  t.className = "toast" + (ok ? " ok" : "");
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

function decodeJwtSub(jwt) {
  try {
    const payload = JSON.parse(
      atob(jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))
    );
    return payload.sub;
  } catch (_) {
    return null;
  }
}

async function api(path, opts = {}) {
  const url = state.apiBase.replace(/\/$/, "") + path;
  const headers = {
    "Authorization": `Bearer ${state.jwt}`,
    ...(opts.body ? { "Content-Type": "application/json" } : {}),
    ...(opts.headers || {}),
  };
  const res = await fetch(url, { ...opts, headers });
  const ct = res.headers.get("content-type") || "";
  const body = ct.includes("json") ? await res.json() : await res.text();
  if (!res.ok) {
    const detail = body?.detail?.message || body?.message || res.statusText;
    throw new Error(`${res.status} ${detail}`);
  }
  return body;
}

// --- queue --------------------------------------------------------------

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) {
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }
  return d.toLocaleDateString([], { month: "short", day: "numeric" });
}

function renderQueue() {
  const scope = $("#filterScope").value;
  const status = $("#filterStatus").value;
  const reqType = $("#filterRequester").value;

  const filtered = state.tickets.filter((t) => {
    if (scope && t.scope !== scope) return false;
    if (status && t.status !== status) return false;
    if (reqType && t.requester_type !== reqType) return false;
    return true;
  });

  const rows = $("#rows");
  if (filtered.length === 0) {
    rows.innerHTML = `<div class="empty">No tickets match.</div>`;
    return;
  }
  rows.innerHTML = filtered.map((t) => `
    <div class="row ${t._id === state.activeTicketId ? "active" : ""}" data-id="${t._id}">
      <div class="top">
        <span>
          <span class="pill ${t.scope}">${t.scope}</span>
          <span class="pill ${t.status}">${t.status}</span>
        </span>
        <span>${fmtTime(t.last_message_at)}</span>
      </div>
      <div class="subject">${escapeHtml(t.subject || "(no subject)")}</div>
      <div class="preview">${escapeHtml(t.last_message_preview || "")}</div>
      <div class="top" style="margin-top:4px;">
        <span>${t.requester_type}</span>
        <span>${t._id.slice(0, 8)}…</span>
      </div>
    </div>
  `).join("");
  $$("#rows .row").forEach((el) => {
    el.addEventListener("click", () => selectTicket(el.dataset.id));
  });
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

async function loadQueue() {
  if (!state.apiBase || !state.jwt) return;
  try {
    const res = await api("/v1/admin/support_tickets?limit=100");
    state.tickets = res.data || [];
    setStatus(`queue: ${state.tickets.length} ticket(s)`);
    renderQueue();
    if (state.activeTicketId) {
      await refreshActiveThread();
    }
  } catch (e) {
    setStatus(`error: ${e.message}`, false);
    toast(`Load failed: ${e.message}`);
  }
}

// --- ticket detail ------------------------------------------------------

async function selectTicket(ticketId) {
  state.activeTicketId = ticketId;
  $$("#rows .row").forEach((el) =>
    el.classList.toggle("active", el.dataset.id === ticketId)
  );

  try {
    const ticketRes = await api(`/v1/admin/support_tickets/${ticketId}`);
    const ticket = ticketRes.data;
    renderMeta(ticket);
    renderThread(ticket.messages || []);
    $("#composer").style.display = "flex";
  } catch (e) {
    toast(`Open failed: ${e.message}`);
  }
}

async function refreshActiveThread() {
  if (!state.activeTicketId) return;
  try {
    const ticketRes = await api(
      `/v1/admin/support_tickets/${state.activeTicketId}`
    );
    renderThread(ticketRes.data.messages || []);
  } catch (e) {
    // silent — polling refresh
  }
}

function renderMeta(ticket) {
  const meta = $("#meta");
  meta.innerHTML = `
    <div class="title">${escapeHtml(ticket.subject || "(no subject)")}</div>
    <span class="pill ${ticket.scope}">${ticket.scope}</span>
    <span class="pill ${ticket.status}">${ticket.status}</span>
    <span style="color:var(--muted);font-size:12px;">
      ${ticket.requester_type} · ${ticket._id.slice(0,8)}…
    </span>
    <select id="statusSelect" data-current="${ticket.status}">
      ${["open","pending","resolved","closed"]
        .map(s => `<option value="${s}" ${s===ticket.status?"selected":""}>Set ${s}</option>`)
        .join("")}
    </select>
  `;
  $("#statusSelect").addEventListener("change", async (e) => {
    const newStatus = e.target.value;
    const current = e.target.dataset.current;
    if (newStatus === current) return;
    try {
      await api(`/v1/admin/support_tickets/${ticket._id}/status`, {
        method: "PATCH",
        body: JSON.stringify({ status: newStatus }),
      });
      toast(`Status → ${newStatus}`, true);
      await loadQueue();
    } catch (err) {
      toast(`Status change failed: ${err.message}`);
      e.target.value = current;
    }
  });
}

function renderThread(messages) {
  const t = $("#thread");
  if (messages.length === 0) {
    t.innerHTML = `<div class="empty">No messages yet.</div>`;
    return;
  }
  t.innerHTML = messages.map((m) => {
    const isMe = m.sender_id === state.myUserId;
    const media = m.media
      ? `<div class="media">📎 <a href="${m.media.url}" target="_blank">${m.media.type}</a>${m.media.caption ? " · " + escapeHtml(m.media.caption) : ""}</div>`
      : "";
    return `
      <div class="msg ${isMe ? "me" : ""}">
        <div class="from">${m.sender_id.slice(0,8)}…</div>
        <div class="content">${escapeHtml(m.content || "")}</div>
        ${media}
        <div class="ts">${fmtTime(m.timestamp)}</div>
      </div>
    `;
  }).join("");
  t.scrollTop = t.scrollHeight;
}

// --- reply --------------------------------------------------------------

async function sendReply() {
  const textarea = $("#reply");
  const content = textarea.value.trim();
  if (!content || !state.activeTicketId) return;

  $("#send").disabled = true;
  try {
    await api(`/v1/admin/support_tickets/${state.activeTicketId}/reply`, {
      method: "POST",
      body: JSON.stringify({ content }),
    });
    textarea.value = "";
    await loadQueue();
  } catch (e) {
    toast(`Send failed: ${e.message}`);
  } finally {
    $("#send").disabled = false;
  }
}

// --- wiring -------------------------------------------------------------

$("#connect").addEventListener("click", () => {
  state.apiBase = $('[data-field="apiBase"]').value.trim();
  state.jwt = $('[data-field="jwt"]').value.trim();
  localStorage.setItem("supportApiBase", state.apiBase);
  localStorage.setItem("supportJwt", state.jwt);
  state.myUserId = decodeJwtSub(state.jwt);
  setStatus(state.myUserId ? `connected as ${state.myUserId.slice(0,8)}…` : "JWT parse failed", !!state.myUserId);
  loadQueue();
  if (state.pollHandle) clearInterval(state.pollHandle);
  state.pollHandle = setInterval(loadQueue, 10000);
});

$("#refresh").addEventListener("click", loadQueue);
$("#filterScope").addEventListener("change", renderQueue);
$("#filterStatus").addEventListener("change", renderQueue);
$("#filterRequester").addEventListener("change", renderQueue);
$("#send").addEventListener("click", sendReply);
$("#reply").addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
    e.preventDefault();
    sendReply();
  }
});

if (state.apiBase && state.jwt) {
  state.myUserId = decodeJwtSub(state.jwt);
  setStatus(state.myUserId ? `connected as ${state.myUserId.slice(0,8)}…` : "JWT parse failed", !!state.myUserId);
  loadQueue();
  state.pollHandle = setInterval(loadQueue, 10000);
}
</script>
</body>
</html>
